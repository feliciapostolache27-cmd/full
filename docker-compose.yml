# Lecția 7 — checkpoint de proiect: `docker compose up` pornește toată aplicația
# (backend + PostgreSQL + Redis), fără nimic instalat pe laptop în afară de Docker.
#
# Backend-ul nu are NIMIC hardcodat despre "docker" — rulează exact același jar,
# cu exact aceleași profiluri Spring dev/prod din Lecția 6. Compose doar setează
# variabilele de mediu pe care Lecția 6 le-a făcut deja externalizabile
# (APP_DB_HOST, APP_REDIS_HOST, ...), ca să indice spre serviciile vecine în loc
# de "localhost".

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e-commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2302"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Rulate o singură dată, la primul start al volumului — tabelele + datele de test.
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e-commerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_DB_HOST: postgres
      APP_DB_PASSWORD: "2302"
      APP_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
