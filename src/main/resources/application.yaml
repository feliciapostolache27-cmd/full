server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/e-commerce
    username: postgres
    password: 2302

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.format_sql: true

  # Lecția 3 — cache Redis. Memurai (pe Windows) sau Redis, pe portul 6379.
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${APP_JWT_SECRET:impact-academies-dev-secret-key-do-not-use-in-production-0123456789}
    expiration-minutes: 120
  # Lecția 5 — Strategy pattern: ce categorie e la reducere și cu cât. Schimbă
  # promoția modificând valorile astea, nu codul (vezi CategoryPercentageDiscountStrategy).
  discount:
    category-name: Accesorii
    percentage: 15

# Lecția 3 — Swagger UI la /swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    md.impact.ecommerce: INFO
